[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lmdb_sensor_storage"
authors = [
    {name = "Thomas Wagner", email = "wagner-thomas@gmx.at"},
]
description = "Efficient storage for sensor data using lmdb as backend"
readme = "README.md"
requires-python = ">=3.7"
# Note: the SPDX string format needs setuptools>=77, which needs Python>=3.9 to build
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "lmdb",
    "numpy>=1.7",
    "plotly>=4.0",
    "urllib3",
    "paho-mqtt>=2.0",
    "PyYAML",
    "requests",
    "typing_extensions",
    "sortedcontainers",
    "simplejson",
]
dynamic = ["version"]

[project.urls]
repository = 'https://github.com/Aikhjarto/lmdb_sensor_storage'

[tool.setuptools]
# the Nagios plugin is installed as script
script-files = ["scripts/check_lmdb_sensor_data_age.py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lmdb_sensor_storage = ["etc/systemd/system/*.service", "etc/systemd/system/*.timer"]

# version from git tags, e.g. "v0.2" or "0.2"
[tool.setuptools_scm]
